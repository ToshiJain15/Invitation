<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 100" class="wedding-car-svg">
  <defs>
    <!-- Gold Metallic Gradients -->
    <linearGradient id="carGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fae78b"/>
      <stop offset="50%" stop-color="#c99e32"/>
      <stop offset="100%" stop-color="#8c6e14"/>
    </linearGradient>
    <linearGradient id="carBodyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7a131e"/>
      <stop offset="40%" stop-color="#5c0911"/>
      <stop offset="100%" stop-color="#380409"/>
    </linearGradient>
    <linearGradient id="creamGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#fff8eb"/>
      <stop offset="100%" stop-color="#eedfc3"/>
    </linearGradient>
    <radialGradient id="headlightBeam" cx="0%" cy="50%" r="100%">
      <stop offset="0%" stop-color="rgba(255, 240, 160, 0.7)"/>
      <stop offset="60%" stop-color="rgba(255, 230, 120, 0.2)"/>
      <stop offset="100%" stop-color="rgba(255, 230, 120, 0)"/>
    </radialGradient>
    <filter id="carGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="rgba(0,0,0,0.35)"/>
    </filter>
  </defs>

  <!-- Headlight Beam Shining Forward -->
  <polygon points="180,68 240,55 240,82 180,72" fill="url(#headlightBeam)" class="headlight-beam" opacity="0.8"/>

  <!-- Exhaust Heart Smoke Puffs (Animated) -->
  <g class="exhaust-hearts">
    <path d="M 12 70 C 10 65, 3 67, 7 73 C 12 78, 14 74, 12 70 Z" fill="#e8939c" class="smoke-puff puff-1" opacity="0.7"/>
    <path d="M 4 66 C 2 62, -3 64, 0 69 C 4 73, 6 70, 4 66 Z" fill="#f4bcc2" class="smoke-puff puff-2" opacity="0.5"/>
  </g>

  <!-- Floating Heart Balloons from Rear -->
  <g class="car-balloons">
    <!-- Strings -->
    <path d="M 32 50 Q 22 35 18 20" stroke="#d4af37" stroke-width="0.8" fill="none"/>
    <path d="M 32 50 Q 28 32 28 14" stroke="#d4af37" stroke-width="0.8" fill="none"/>
    <path d="M 32 50 Q 38 34 40 18" stroke="#d4af37" stroke-width="0.8" fill="none"/>
    <!-- Heart Balloons -->
    <path d="M 18 20 C 14 14, 8 18, 12 24 C 18 30, 20 26, 18 20 Z" fill="#e63946" transform="rotate(-15 18 20)"/>
    <path d="M 28 14 C 24 8, 18 12, 22 18 C 28 24, 30 20, 28 14 Z" fill="#fae78b" transform="rotate(5 28 14)"/>
    <path d="M 40 18 C 36 12, 30 16, 34 22 C 40 28, 42 24, 40 18 Z" fill="#e27396" transform="rotate(20 40 18)"/>
  </g>

  <!-- Main Vintage Car Chassis & Shadow -->
  <ellipse cx="100" cy="85" rx="85" ry="7" fill="rgba(0,0,0,0.3)"/>

  <!-- Vintage Fender & Lower Running Board -->
  <!-- Rear Fender Curved Arch -->
  <path d="M 22 75 C 22 55, 62 55, 62 75 L 75 75 L 125 75 C 125 55, 165 55, 165 75 L 182 75 C 186 75, 188 72, 186 68 L 175 62 C 168 58, 160 58, 155 58 L 138 58 L 138 52 C 138 46, 132 40, 125 40 L 78 40 C 68 40, 62 46, 58 52 L 40 54 C 32 55, 26 60, 22 67 Z" 
        fill="url(#creamGrad)" stroke="url(#carGoldGrad)" stroke-width="1.5" filter="url(#carGlow)"/>

  <!-- Vintage Carriage Cab (Imperial Maroon Velvet) -->
  <path d="M 62 52 C 65 42, 72 35, 82 35 L 118 35 C 126 35, 132 41, 134 49 L 135 54 L 60 54 Z" 
        fill="url(#carBodyGrad)" stroke="url(#carGoldGrad)" stroke-width="1.2"/>

  <!-- Cab Windows (Cream Tinted Glass) -->
  <path d="M 68 50 C 70 42, 75 38, 83 38 L 96 38 L 96 50 Z" fill="#fff9eb" opacity="0.9" stroke="#c99e32" stroke-width="0.8"/>
  <path d="M 100 38 L 115 38 C 122 38, 126 42, 128 49 L 128 50 L 100 50 Z" fill="#fff9eb" opacity="0.9" stroke="#c99e32" stroke-width="0.8"/>

  <!-- Happy Royal Couple Silhouettes in Window -->
  <!-- Groom Silhouette with Royal Turban & Kalgi -->
  <circle cx="80" cy="45" r="4" fill="#5c0911"/>
  <path d="M 77 42 C 77 39, 83 39, 83 42 Z" fill="#c99e32"/> <!-- Turban -->
  <line x1="80" y1="39" x2="80" y2="36" stroke="#fae78b" stroke-width="1"/> <!-- Kalgi Feather -->
  <!-- Bride Silhouette with Dupatta & Nath -->
  <circle cx="89" cy="45.5" r="3.7" fill="#8a1322"/>
  <path d="M 87 43 C 86 40, 93 41, 93 45 C 93 49, 87 49, 87 45 Z" fill="#d4af37" opacity="0.7"/> <!-- Veil / Dupatta -->

  <!-- Hood Floral Garland (Marigolds & Roses) -->
  <g class="floral-garland">
    <path d="M 135 55 Q 155 62 178 64" stroke="#2d6a4f" stroke-width="2.5" fill="none"/>
    <!-- Blossoms along garland -->
    <circle cx="140" cy="57" r="3" fill="#ff758f"/>
    <circle cx="148" cy="59" r="3" fill="#ffb703"/>
    <circle cx="156" cy="61" r="3.2" fill="#ff4d6d"/>
    <circle cx="164" cy="62" r="3" fill="#fb8500"/>
    <circle cx="172" cy="63" r="3" fill="#ff758f"/>
  </g>

  <!-- Golden Grille & Bumper -->
  <rect x="180" y="60" width="4" height="15" rx="2" fill="url(#carGoldGrad)"/>
  <path d="M 178 72 L 188 72 C 190 72, 191 74, 190 76 L 178 76 Z" fill="url(#carGoldGrad)"/>
  <!-- Front Headlight (Shiny Brass) -->
  <circle cx="178" cy="66" r="5" fill="url(#carGoldGrad)"/>
  <circle cx="179" cy="66" r="3" fill="#fffbe0"/>

  <!-- Vintage Side Spare Wheel / Brass Lantern -->
  <ellipse cx="64" cy="64" rx="4" ry="7" fill="#3a0408" stroke="url(#carGoldGrad)" stroke-width="1"/>

  <!-- Just Married / V & T Royal Plaque on Door -->
  <rect x="85" y="58" width="30" height="12" rx="3" fill="#ffffff" stroke="url(#carGoldGrad)" stroke-width="1"/>
  <text x="100" y="66" font-family="'Cinzel', serif" font-size="6.5" font-weight="bold" fill="#5c0911" text-anchor="middle">V 𑁍 T</text>

  <!-- Rear Brass Luggage Trunk -->
  <rect x="22" y="54" width="16" height="13" rx="2" fill="#4a1506" stroke="url(#carGoldGrad)" stroke-width="1"/>
  <line x1="22" y1="60" x2="38" y2="60" stroke="#c99e32" stroke-width="0.8"/>

  <!-- WHEEL 1 (Rear Wheel with Spokes) -->
  <g class="car-wheel wheel-rear" transform="translate(42, 75)">
    <!-- Tire Rubber -->
    <circle cx="0" cy="0" r="14" fill="#222" stroke="#444" stroke-width="2"/>
    <circle cx="0" cy="0" r="11" fill="#fffcf5"/> <!-- Whitewall tire rim -->
    <circle cx="0" cy="0" r="8" fill="url(#carGoldGrad)"/> <!-- Brass Hub -->
    <!-- Wire Spokes -->
    <g class="spokes">
      <line x1="0" y1="-8" x2="0" y2="8" stroke="#8c6e14" stroke-width="0.8"/>
      <line x1="-8" y1="0" x2="8" y2="0" stroke="#8c6e14" stroke-width="0.8"/>
      <line x1="-6" y1="-6" x2="6" y2="6" stroke="#8c6e14" stroke-width="0.8"/>
      <line x1="-6" y1="6" x2="6" y2="-6" stroke="#8c6e14" stroke-width="0.8"/>
    </g>
    <!-- Center Gold Cap -->
    <circle cx="0" cy="0" r="3" fill="#fff2a1"/>
  </g>

  <!-- WHEEL 2 (Front Wheel with Spokes) -->
  <g class="car-wheel wheel-front" transform="translate(145, 75)">
    <!-- Tire Rubber -->
    <circle cx="0" cy="0" r="14" fill="#222" stroke="#444" stroke-width="2"/>
    <circle cx="0" cy="0" r="11" fill="#fffcf5"/> <!-- Whitewall tire rim -->
    <circle cx="0" cy="0" r="8" fill="url(#carGoldGrad)"/> <!-- Brass Hub -->
    <!-- Wire Spokes -->
    <g class="spokes">
      <line x1="0" y1="-8" x2="0" y2="8" stroke="#8c6e14" stroke-width="0.8"/>
      <line x1="-8" y1="0" x2="8" y2="0" stroke="#8c6e14" stroke-width="0.8"/>
      <line x1="-6" y1="-6" x2="6" y2="6" stroke="#8c6e14" stroke-width="0.8"/>
      <line x1="-6" y1="6" x2="6" y2="-6" stroke="#8c6e14" stroke-width="0.8"/>
    </g>
    <!-- Center Gold Cap -->
    <circle cx="0" cy="0" r="3" fill="#fff2a1"/>
  </g>
</svg>